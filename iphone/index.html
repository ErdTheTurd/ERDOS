<!DOCTYPE html>
<html lang="en" data-erdos-shell="phone">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>ERDOS</title>
  <link rel="icon" href="assets/blok-mark.svg" />
  <link rel="stylesheet" href="css/phone.css" />
</head>
<body>
  <div class="shell">
    <section id="panel-browser" class="panel" data-panel="browser"></section>
    <section id="panel-blok" class="panel" data-panel="blok" hidden></section>
    <section id="panel-erdai" class="panel" data-panel="erdai" hidden></section>
    <section id="panel-notes" class="panel" data-panel="notes" hidden></section>
    <section id="panel-arcade" class="panel" data-panel="arcade" hidden></section>
  </div>
  <nav class="tabbar" aria-label="Sections">
    <button type="button" data-tab="browser" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 12h16M12 4c2 2.4 3 5 3 8s-1 5.6-3 8c-2-2.4-3-5-3-8s1-5.6 3-8z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      Browser
    </button>
    <button type="button" data-tab="blok">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="9" y="4" width="6" height="6" rx="1.4" fill="currentColor"/></svg>
      Blok
    </button>
    <button type="button" data-tab="erdai">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.6 4.6L18 9.2l-4.4 1.6L12 15.4l-1.6-4.6L6 9.2l4.4-1.6L12 3z" fill="currentColor"/></svg>
      ERDAI
    </button>
    <button type="button" data-tab="notes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14H7V3z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 3v4h4M9 12h6M9 16h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Notes
    </button>
    <button type="button" data-tab="arcade">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 12.5h4M10 10.5v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Arcade
    </button>
  </nav>
  <div id="toast-host"></div>
  <div id="sheet-host"></div>
  <div id="settings-host"></div>
  <script src="js/blok-logic.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/erdos-search.js"></script>
  <script src="js/browser-ui.js"></script>
  <script src="js/blok-ui.js"></script>
  <script src="js/erdai-ui.js"></script>
  <script src="js/notes-ui.js"></script>
  <script src="js/arcade.js"></script>
  <script src="js/onboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
