<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https: http:; connect-src 'self' https:; media-src 'self' data:; frame-src *; child-src *" />
  <title>ErdOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/desktop.css" />
</head>
<body>
  <div id="boot-screen" class="boot-screen" aria-live="polite">
    <div class="crt-overlay" aria-hidden="true"></div>
    <div class="boot-inner">
      <div class="boot-mark">ErdOS</div>
      <p class="boot-sub">PHOSPHOR GLASS DESKTOP</p>
      <div class="boot-bar"><div class="boot-bar-fill"></div></div>
      <p id="boot-status" class="boot-status">Warming CRT…</p>
    </div>
  </div>

  <div id="desktop" class="desktop" hidden>
    <div id="wallpaper" class="wallpaper wallpaper-phosphor-grid" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div id="desktop-icons" class="desktop-icons"></div>
    <div id="windows-layer" class="windows-layer"></div>

    <div id="context-menu" class="context-menu" hidden>
      <button type="button" data-action="refresh">Refresh</button>
      <button type="button" data-action="new-note">New Sticky Note</button>
      <button type="button" data-action="wallpaper">Cycle Wallpaper</button>
      <button type="button" data-action="quest">Today</button>
    </div>

    <div id="quest-overlay" class="quest-overlay" hidden>
      <div class="quest-panel">
        <div class="quest-head">
          <strong id="quest-title">Quests</strong>
          <button type="button" id="quest-close" class="win-btn" aria-label="Close">×</button>
        </div>
        <p id="erdai-coach" class="erdai-coach"></p>
        <div class="quest-meter"><div id="quest-fill" class="quest-fill"></div></div>
        <p id="quest-count" class="quest-count">0 / 5</p>
        <ul id="quest-list" class="quest-list"></ul>
        <h4 class="quest-sub">Daily</h4>
        <ul id="daily-list" class="quest-list"></ul>
        <button type="button" id="quest-do-next" class="app-btn" style="width:100%;margin-top:12px">Continue</button>
      </div>
    </div>

    <div id="start-menu" class="start-menu" hidden>
      <div class="start-brand">
        <div class="start-brand-row">
          <div>
            <span class="start-logo">ErdOS</span>
            <span class="start-tag">Phosphor Glass · v1.5</span>
          </div>
          <button type="button" id="start-close" class="win-btn close" aria-label="Close menu">×</button>
        </div>
      </div>
      <div class="start-search-wrap">
        <input id="start-search" type="search" placeholder="Search apps…" autocomplete="off" />
      </div>
      <div class="start-panes">
        <div class="start-pane">
          <h4>Pinned</h4>
          <div id="start-pinned" class="start-apps"></div>
        </div>
        <div class="start-pane">
          <h4>All apps</h4>
          <div id="start-apps" class="start-apps"></div>
        </div>
      </div>
      <div class="start-footer">
        <button type="button" id="btn-quest" class="start-secondary">Today</button>
        <button type="button" id="btn-shutdown" class="start-power">Shut Down</button>
      </div>
    </div>

    <div id="notif-panel" class="notif-panel" hidden>
      <div class="notif-head">Today</div>
      <div class="notif-body"></div>
    </div>

    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
    <div id="coach-bubble" class="coach-bubble" hidden></div>
    <div id="juice-layer" aria-hidden="true"></div>

    <footer id="taskbar" class="taskbar">
      <button type="button" id="btn-start" class="taskbar-start" aria-label="Start menu">
        <span class="start-orb"></span>
        <span>ErdOS</span>
      </button>
      <div id="taskbar-pins" class="taskbar-pins"></div>
      <div id="taskbar-apps" class="taskbar-apps"></div>
      <div class="taskbar-tray">
        <button type="button" id="streak-chip" class="streak-chip" title="Daily streak">—</button>
        <button type="button" id="xp-chip" class="xp-chip" title="Level">
          <span id="xp-level">1</span>
          <span class="xp-bar"><span id="xp-fill" class="xp-fill"></span></span>
        </button>
        <button type="button" id="btn-clock" class="clock-btn">
          <time id="clock" class="clock"></time>
        </button>
      </div>
    </footer>
  </div>

  <script src="js/sound.js"></script>
  <script src="js/juice.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/window-manager.js"></script>
  <script src="js/shell.js"></script>
</body>
</html>
