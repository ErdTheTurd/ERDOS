<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https: http:; connect-src 'self' https:; media-src 'self' data:; frame-src *; child-src *" />
  <title>ErdOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/desktop.css" />
</head>
<body>
  <div id="boot-screen" class="boot-screen" aria-live="polite">
    <div class="boot-mark">ErdOS</div>
    <div class="boot-bar"><div class="boot-bar-fill"></div></div>
    <p class="boot-status">Starting desktop…</p>
  </div>

  <div id="desktop" class="desktop" hidden>
    <div id="wallpaper" class="wallpaper" aria-hidden="true"></div>
    <div id="desktop-icons" class="desktop-icons"></div>
    <div id="windows-layer" class="windows-layer"></div>

    <div id="start-menu" class="start-menu" hidden>
      <div class="start-brand">
        <span class="start-logo">ErdOS</span>
        <span class="start-tag">Desktop Environment</span>
      </div>
      <div id="start-apps" class="start-apps"></div>
      <div class="start-footer">
        <button type="button" id="btn-shutdown" class="start-power">Shut Down</button>
      </div>
    </div>

    <footer id="taskbar" class="taskbar">
      <button type="button" id="btn-start" class="taskbar-start" aria-label="Start menu">
        <span class="start-orb"></span>
        <span>ErdOS</span>
      </button>
      <div id="taskbar-apps" class="taskbar-apps"></div>
      <div class="taskbar-tray">
        <span id="tray-status" class="tray-status">Online</span>
        <time id="clock" class="clock"></time>
      </div>
    </footer>
  </div>

  <script src="js/apps.js"></script>
  <script src="js/window-manager.js"></script>
  <script src="js/shell.js"></script>
</body>
</html>
