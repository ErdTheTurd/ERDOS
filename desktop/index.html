<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.puter.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https: http: blob:; connect-src 'self' https: wss: blob:; media-src 'self' data: blob:; frame-src * https://puter.com https://*.puter.com; child-src *; worker-src 'self' blob:" />
  <title>ErdOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/desktop.css" />
</head>
<body>
  <div id="boot-screen" class="boot-screen" aria-live="polite">
    <div class="crt-overlay" aria-hidden="true"></div>
    <div class="boot-inner">
      <div class="boot-mark">ErdOS</div>
      <p class="boot-sub">PHOSPHOR GLASS DESKTOP</p>
      <div class="boot-bar"><div class="boot-bar-fill"></div></div>
      <p id="boot-status" class="boot-status">Warming glass…</p>
    </div>
  </div>

  <div id="desktop" class="desktop" hidden>
    <div id="wallpaper" class="wallpaper wallpaper-phosphor-grid" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div id="desktop-icons" class="desktop-icons"></div>
    <div id="windows-layer" class="windows-layer"></div>

    <div id="context-menu" class="context-menu" hidden>
      <button type="button" data-action="refresh">Refresh</button>
      <button type="button" data-action="new-note">New Sticky Note</button>
      <button type="button" data-action="wallpaper">Cycle Wallpaper</button>
      <button type="button" data-action="erdai">Open ERDAI</button>
    </div>

    <div id="start-menu" class="start-menu" hidden>
      <div class="start-brand">
        <div class="start-brand-row">
          <div>
            <span class="start-logo">ErdOS</span>
            <span class="start-tag">Phosphor Glass · v1.6</span>
          </div>
          <button type="button" id="start-close" class="win-btn close" aria-label="Close menu">×</button>
        </div>
      </div>
      <div class="start-search-wrap">
        <input id="start-search" type="search" placeholder="Search apps…" autocomplete="off" />
      </div>
      <div class="start-panes">
        <div class="start-pane">
          <h4>Pinned</h4>
          <div id="start-pinned" class="start-apps"></div>
        </div>
        <div class="start-pane">
          <h4>All apps</h4>
          <div id="start-apps" class="start-apps"></div>
        </div>
      </div>
      <div class="start-footer">
        <button type="button" id="btn-erdai" class="start-secondary">ERDAI</button>
        <button type="button" id="btn-shutdown" class="start-power">Shut Down</button>
      </div>
    </div>

    <div id="notif-panel" class="notif-panel" hidden>
      <div class="notif-head">Today</div>
      <div class="notif-body"></div>
    </div>

    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
    <div id="juice-layer" aria-hidden="true"></div>

    <footer id="taskbar" class="taskbar">
      <button type="button" id="btn-start" class="taskbar-start" aria-label="Start menu">
        <span class="start-orb"></span>
        <span>ErdOS</span>
      </button>
      <div id="taskbar-pins" class="taskbar-pins"></div>
      <div id="taskbar-apps" class="taskbar-apps"></div>
      <div class="taskbar-tray">
        <button type="button" id="btn-clock" class="clock-btn">
          <time id="clock" class="clock"></time>
        </button>
      </div>
    </footer>
  </div>

  <script src="https://js.puter.com/v2/"></script>
  <script src="js/sound.js"></script>
  <script src="js/juice.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/erdai.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/window-manager.js"></script>
  <script src="js/shell.js"></script>
</body>
</html>
